<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org">

<body>



	<div class="container">
		<div class="row">
			<h1>Cadastrar Usuário</h1>
		</div>
		<div class="row">

			<form th:object="${usuario}" action="/insere_usuario" method="post">

				Nome: <input class="form-control" type="text" th:field="*{nome}"><br>
				Senha: <input class="form-control" type="password"
					th:field="*{senha}"><br> 
			
			<label for="setor">Setor:</label>
				<select class="form-select" th:field="*{id_setor}" id="setor">
				    <option th:each="setor : ${lista_setores}" th:value="${setor.id}" th:text="${setor.nome}"></option>
				</select>

				<button type="submit">Cadastrar Funcionario</button>
			</form>

		</div>
		<div class="row">
			<a href="/index">Listar Funcionarios</a>
		</div>
	</div>

	<!-- Option 1: Bootstrap Bundle with Popper -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-ygbV9kiqUc6oa4msXn9868pTtWMgiQaeYH7/t7LECLbyPA2x65Kgf80OJFdroafW"
		crossorigin="anonymous"></script>
</body>
</html>
